# model revisions and tokenizer settings

llms:
  llama-3.2-3b:
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
    family: llama
    size: small
    loader: causal_lm
    chat_template_kwargs: {date_string: "26 Jul 2024"}  # fix the date in the template
    stop_tokens: ["<|eot_id|>", "<|end_of_text|>", "<|eom_id|>"]
    pad_token: "<|finetune_right_pad_id|>"
    max_model_len: 32768
    tensor_parallel_size: 1

  qwen2.5-3b:
    hf_id: Qwen/Qwen2.5-3B-Instruct
    revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
    family: qwen
    size: small
    loader: causal_lm
    chat_template_kwargs: {}  # keep the default system prompt
    stop_tokens: ["<|im_end|>", "<|endoftext|>"]
    pad_token: "<|endoftext|>"
    max_model_len: 32768
    tensor_parallel_size: 1

  qwen2.5-72b:
    hf_id: Qwen/Qwen2.5-72B-Instruct
    revision: 495f39366efef23836d0cfae4fbe635880d2be31
    family: qwen
    size: big
    loader: causal_lm
    chat_template_kwargs: {}
    stop_tokens: ["<|im_end|>", "<|endoftext|>"]
    pad_token: "<|endoftext|>"
    max_model_len: 32768
    tensor_parallel_size: 4

  gemma-3-4b:
    hf_id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
    family: gemma3
    size: small
    loader: image_text_to_text  # use the multimodal loader with text inputs
    chat_template_kwargs: {}
    stop_tokens: ["<end_of_turn>", "<eos>"]
    pad_token: "<pad>"
    max_model_len: 32768
    tensor_parallel_size: 1
    skip_quant_modules: [vision_tower, multi_modal_projector, lm_head]
    lora_target_regex: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$'

  medgemma-1.5-4b:
    hf_id: google/medgemma-1.5-4b-it
    revision: 91850547d9f0b2fdd21aa7c5f4f3d1a8a52c243b
    family: gemma3
    size: small
    loader: image_text_to_text
    chat_template_kwargs: {}
    # block the thinking token and stop at the control tokens that follow the answer
    stop_tokens: ["<end_of_turn>", "<eos>", "<unused95>", "<unused96>", "<unused97>", "<unused98>"]
    suppress_tokens: ["<unused94>"]
    pad_token: "<pad>"
    max_model_len: 32768
    tensor_parallel_size: 1
    skip_quant_modules: [vision_tower, multi_modal_projector, lm_head]
    lora_target_regex: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$'

encoders:
  bioclinical-modernbert:
    hf_id: thomas-sounack/BioClinical-ModernBERT-base
    revision: c3648aa87af95837c809e6f0c5f85d08160db437
    tasks: [causal, negation, disease]

# default lora targets for causal language models
lora_default_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
